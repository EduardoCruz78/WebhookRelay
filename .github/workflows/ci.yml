name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Lint, typecheck, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Fails if a production dependency has a known vulnerability. Dev-only tools are reviewed by hand.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Verify formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Like EF Core's HasPendingModelChanges: a schema change without its migration fails the build.
      - name: Verify migrations match the schema
        run: |
          npx drizzle-kit generate --name drift-check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            git status --porcelain drizzle
            echo "::error::src/infrastructure/db/schema.ts changed without a migration. Run npm run db:generate."
            exit 1
          fi

      # Ubuntu runners ship with Docker, so Testcontainers-based integration tests run here.
      - name: Test
        run: npm test

  docker:
    name: Docker image and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-and-test

    steps:
      - uses: actions/checkout@v7

      - name: Start the stack
        run: docker compose up --detach --build --wait

      - name: Smoke test
        run: |
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:3000/health; then echo; break; fi
            sleep 2
          done
          curl --silent --fail http://localhost:3000/health | grep -q '"status":"ok"'

          # Create a source API key with the CLI shipped in the image, then publish an event twice.
          KEY=$(docker compose run --rm --no-deps migrate node dist/cli/create-api-key.js --name ci --role source --source ci-smoke 2>/dev/null)
          EVENT='{"id":"smoke-1","type":"appointment.created","occurredAt":"2026-12-07T12:00:00Z","data":{"ok":true}}'
          publish() {
            curl --silent --output /dev/null --write-out '%{http_code}' -X POST http://localhost:3000/events               -H "Authorization: Bearer $KEY" -H 'Content-Type: application/json' -d "$EVENT"
          }
          test "$(publish)" = 202
          test "$(publish)" = 200
          echo "Smoke test passed"

      - name: Container logs
        if: always()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down --volumes
