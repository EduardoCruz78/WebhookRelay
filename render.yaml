# Render Blueprint: the whole demo deployment as code.
# One free Web Service runs the HTTP API and the delivery worker together (RUN_WORKER). In a paid
# setup the same image would also run as a Background Worker with `node dist/worker.js`.
# The database is a Neon PostgreSQL 17 (same project and region as SchedulingApi).
services:
  - type: web
    name: webhook-relay
    runtime: docker
    plan: free
    # Same region as the Neon database (AWS us-east-1).
    region: virginia
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Neon connection string (postgresql://...?sslmode=require). Secret: set in the dashboard.
      - key: DATABASE_URL
        sync: false
      # Neon's free tier has a small connection limit; the web process and pg-boss share this pool.
      - key: DATABASE_POOL_SIZE
        value: '5'
      # Demo convenience; a production pipeline would run `node dist/migrate.js` before the release.
      - key: MIGRATE_ON_START
        value: 'true'
      - key: RUN_WORKER
        value: 'true'
      - key: WORKER_CONCURRENCY
        value: '3'
      # SSRF protection fully on: only https targets that resolve to public addresses.
      - key: ALLOW_PRIVATE_TARGETS
        value: 'false'
      - key: ALLOW_HTTP_TARGETS
        value: 'false'
      # API keys created at startup (no shell on the free tier to run the CLI). Random values
      # generated by Render; copy BOOTSTRAP_SOURCE_KEY into SchedulingApi's Outbox__ApiKey.
      - key: BOOTSTRAP_ADMIN_KEY
        generateValue: true
      - key: BOOTSTRAP_SOURCE
        value: scheduling-api
      - key: BOOTSTRAP_SOURCE_KEY
        generateValue: true
      # /metrics is on a public host here, so it requires this token.
      - key: METRICS_TOKEN
        generateValue: true
