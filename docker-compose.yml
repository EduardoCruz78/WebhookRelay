# Local stack: `docker compose up --build`, then open http://localhost:3000/health
# Credentials below are for throwaway local containers only, never for a real deployment.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: webhook_relay
      POSTGRES_USER: webhook_relay
      POSTGRES_PASSWORD: webhook_relay
    ports:
      # 5434 on the host: 5432 and 5433 are often taken by a local PostgreSQL install or the SchedulingApi stack.
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U webhook_relay -d webhook_relay']
      interval: 5s
      timeout: 3s
      retries: 10

  # One-off job: applies migrations, then exits. The API starts only after it succeeds,
  # the same order a deployment pipeline should follow.
  migrate:
    build: .
    command: ['node', 'dist/migrate.js']
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://webhook_relay:webhook_relay@db:5432/webhook_relay

  api:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://webhook_relay:webhook_relay@db:5432/webhook_relay
      NODE_ENV: production
      PORT: '3000'
      LOG_LEVEL: info
    ports:
      - '3000:3000'
    healthcheck:
      # BusyBox wget ships with Alpine, so the check needs no extra package.
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:3000/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10

  # Same image, different command: consumes the queue and delivers. Scale it with
  # `docker compose up --scale worker=3`; pg-boss hands each job to exactly one of them.
  worker:
    build: .
    command: ['node', 'dist/worker.js']
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://webhook_relay:webhook_relay@db:5432/webhook_relay
      NODE_ENV: production
      LOG_LEVEL: info
    stop_grace_period: 30s

volumes:
  pgdata:
